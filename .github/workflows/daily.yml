{"name":"Sync daily AI digest","on":{"schedule":[{"cron":"15 4 * * *"}],"workflow_dispatch":{}},"permissions":{"contents":"write"},"jobs":{"sync":{"runs-on":"ubuntu-latest","steps":[{"uses":"actions/checkout@v4"},{"name":"Fetch daily data","run":"curl -fsSL https://www.qaz5678.xyz/data/daily.json -o /tmp/daily.json"},{"name":"Render DAILY.md","shell":"bash","run":"{\n  echo \"# Daily AI Radar - $(jq -r .date /tmp/daily.json)\"\n  echo\n  echo \"Source: https://www.qaz5678.xyz/daily/\"\n  echo\n  echo \"## AI News Top 10\"\n  jq -r '.news | to_entries[] | \"\\(.key + 1). [\\(.value.title)](\\(.value.url))\"' /tmp/daily.json\n  echo\n  echo \"## Trending AI Projects Top 10\"\n  jq -r '.projects | to_entries[] | \"\\(.key + 1). [\\(.value.name)](\\(.value.url))\"' /tmp/daily.json\n  echo\n  echo \"## Trending AI Models Top 10\"\n  jq -r '.trendingModels | to_entries[] | \"\\(.key + 1). [\\(.value.name)](\\(.value.url))\"' /tmp/daily.json\n  echo\n  echo \"Browse free AI models: https://www.qaz5678.xyz/models/\"\n} > DAILY.md"},{"name":"Commit updates","shell":"bash","run":"git config user.name \"free-ai-directory-bot\"\ngit config user.email \"actions@users.noreply.github.com\"\ngit add DAILY.md\ngit diff --cached --quiet || git commit -m \"Update daily AI digest\"\ngit push"}]}}}
